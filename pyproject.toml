[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dpylogger"
version = "0.0.1"
authors = [
  { name="daisuke6106", email="daisuke6106@gmail.com" },
]
description = "ロギング処理を行うPythonライブラリ"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/daisuke6106/dpylogger"
Issues = "https://github.com/daisuke6106/dpylogger/issues"

[tool.pytest.ini_options]
# pytestの設定
# minversion = "8.0"
# addopts = "-v --color=yes --cov=src/myapp --cov-report=term-missing"
pythonpath = ["src"]
testpaths = ["tests"]
